body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(255,248,238,.06),rgba(244,231,212,.09));pointer-events:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.app{position:relative;max-width:810px;margin:0 auto;padding:34px 14px 24px;min-height:100vh}
.frame{background:rgba(253,247,240,.12);backdrop-filter:blur(1.5px)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:8px 12px 14px;border:2px solid rgba(163,112,62,.38);border-radius:20px;background:linear-gradient(180deg,rgba(255,251,246,.80),rgba(247,235,217,.79));box-shadow:var(--shadow)}
.titlewrap h1{font-size:21px;letter-spacing:.08em;color:#6e4925;margin:0;font-weight:900}
.subline{font-size:10px;letter-spacing:.23em;color:#9a7952;margin-top:4px}
.net{background:#fff7ea;border:1.5px solid #caa06f;border-radius:999px;padding:8px 12px;font-size:11px;font-family:'Malgun Gothic',sans-serif;color:#92663a;white-space:nowrap;box-shadow:0 4px 10px rgba(105,73,38,.08)}
.net.live{color:#2f7f58;border-color:#5ea77f;background:#f5fff8}
.toporn{text-align:center;color:#8f6331;letter-spacing:4px;font-size:16px;margin:4px 0 10px;text-shadow:0 1px 0 #fff}
.main{margin-top:14px}
.waiting{background:linear-gradient(180deg,rgba(255,250,244,.84),rgba(245,235,219,.82));border:2px solid rgba(171,121,69,.58);border-radius:20px;display:flex;justify-content:space-between;align-items:center;padding:18px 18px;box-shadow:var(--shadow)}
.eyebrow{font-size:14px;color:#83592f;font-weight:800}
.waitnumber{font:800 48px/1.06 Georgia,'Malgun Gothic',serif;color:#53371b;margin-top:2px;text-shadow:0 1px 0 #fff}
.ctrl{display:flex;gap:10px}
.ctrl button{width:58px;height:58px;background:#f0e4d1;color:#8a6237;border:1.5px solid #d1ad7f;border-radius:14px;font:800 33px Arial;box-shadow:0 6px 16px rgba(115,85,52,.1)}
.ctrl .add{background:linear-gradient(180deg,#9bb5df,#7c9fd5);color:white;border-color:#7c9fd5}
.section{display:flex;gap:9px;align-items:center;margin:16px 0 11px;color:#815630;font-size:15px;font-weight:900;text-shadow:0 1px 0 #fff}
.section:before,.section:after{content:'';height:1.5px;background:linear-gradient(to right, transparent, rgba(149,104,58,.65), transparent);flex:1}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.room{background:linear-gradient(180deg,rgba(255,250,244,.83),rgba(243,232,213,.78));border:2px solid rgba(171,121,69,.58);border-radius:20px;padding:14px 12px 13px;min-width:0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.room::before{content:'';position:absolute;inset:7px;border:1px solid rgba(171,121,69,.35);border-radius:14px;pointer-events:none}
.roomtitle{font-size:22px;text-align:center;color:#624120;font-weight:900;min-height:29px;position:relative}
.roomcount{text-align:center;font:12px 'Malgun Gothic',sans-serif;color:#8d7256;margin:5px 0 12px;position:relative}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:relative}
.slot{background:rgba(255,250,243,.82);border:1.5px solid #d8b58a;border-radius:14px;min-height:134px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;gap:7px;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.slot.occupied{background:linear-gradient(180deg,rgba(237,247,240,.96),rgba(223,240,229,.92));border-color:#7fb995}
.team{font-size:27px;font-weight:900;color:#745030;line-height:1.1}
.slotstate{font:12px 'Malgun Gothic',sans-serif;color:#8a6d4f;font-weight:700}
.finish{width:100%;min-height:42px;background:linear-gradient(180deg,#46a877,#368a62);color:white;border:1px solid #5dba8c;border-radius:10px;font:800 14px 'Malgun Gothic',sans-serif;box-shadow:0 5px 12px rgba(60,128,91,.18)}
.receive{margin-top:11px;width:100%;min-height:53px;background:linear-gradient(180deg,#88a7d4,#688dc7);color:white;border:1px solid #87a9dc;border-radius:12px;font:800 18px 'Malgun Gothic',sans-serif;position:relative;box-shadow:0 6px 14px rgba(79,112,168,.18)}
.info{font:12px 'Malgun Gothic',sans-serif;text-align:center;min-height:26px;padding:12px 0 3px;color:#7e5e3d;text-shadow:0 1px 0 #fff}.info.error{color:#b2483d}
.footer{text-align:center;font-size:12px;color:#83582f;letter-spacing:.02em;border:2px solid rgba(171,121,69,.38);border-radius:16px;background:linear-gradient(180deg,rgba(255,251,246,.80),rgba(247,235,217,.79));padding:12px 10px;margin-top:10px;box-shadow:var(--shadow)}
.manual{color:#8f775b;font:11px 'Malgun Gothic',sans-serif;text-align:center;margin-top:8px;text-shadow:0 1px 0 #fff}
@media(min-width:600px){.app{padding:20px 24px}.titlewrap h1{font-size:28px}.rooms{gap:18px}.room{padding:20px}.slot{min-height:182px}.team{font-size:35px}.roomtitle{font-size:28px}.finish{font-size:18px}.receive{font-size:20px}.waitnumber{font-size:58px}}
@media(max-width:385px){.app{padding:9px 7px}.titlewrap h1{font-size:17px}.mast{padding:8px 10px 12px}.waiting{padding:12px}.ctrl button{width:46px;height:50px}.room{padding:10px 7px}.roomtitle{font-size:17px}.slot{padding:7px 3px;min-height:120px}.team{font-size:23px}.finish{font-size:12px}.receive{font-size:15px}}

/* Poster frame visible while interface remains readable */
body{background-color:#e8d4b6}
.app{isolation:isolate}
.app:before{content:"";position:absolute;inset:12px 3px 0;border:2px solid rgba(112,75,39,.35);box-shadow:inset 0 0 0 3px rgba(255,239,204,.36),0 14px 35px rgba(56,32,14,.12);pointer-events:none;border-radius:22px;z-index:-1}
.mast,.waiting,.room,.footer{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.toporn{padding:8px 0 12px;color:#8c5424;text-shadow:0 1px 1px #fff;font-size:13px;font-weight:700;letter-spacing:3px}
.mast{border-color:#b9915a;box-shadow:0 7px 20px #53391b29}
.room{box-shadow:0 8px 20px #53391b24}
@media(max-width:599px){body{background-position:center top;background-attachment:fixed}.app{padding:20px 8px 20px}.room{padding:10px 6px}.roomtitle{font-size:18px}.slot{min-height:112px}.team{font-size:23px}.finish{font-size:12px;min-height:39px}.receive{font-size:15px;min-height:46px}.toporn{font-size:11px}.waitnumber{font-size:42px}}
</style></head><body><main class="app"><div class="toporn">✦  ❦  THE STORY BEGINS  ❦  ✦</div><header class="mast"><div class="titlewrap"><h1>DEAR MY STORIES</h1><div class="subline">유스업 × 북끄리 · STAFF BOARD</div></div><span class="net" id="connection">연결 중</span></header><section class="main"><div class="waiting"><div><div class="eyebrow">2층 전체 대기팀</div><div class="waitnumber"><span id="waiting">0</span>팀</div></div><div class="ctrl"><button id="minus" aria-label="대기 1팀 빼기">−</button><button id="plus" class="add" aria-label="대기 1팀 추가">+</button></div></div><div class="section">지하 방탈출 체험 현황</div><div class="rooms"><article class="room"><div class="roomtitle">데미안</div><div class="roomcount" id="demianCount">0 / 2팀 체험 중</div><div class="slots" id="demianSlots"></div><button class="receive" id="demianReceive">+ 1팀 받기</button></article><article class="room"><div class="roomtitle">노인과 바다</div><div class="roomcount" id="seaCount">0 / 2팀 체험 중</div><div class="slots" id="seaSlots"></div><button class="receive" id="seaReceive">+ 1팀 받기</button></article></div></section><div class="info" id="message" role="status"></div><footer class="footer">2층, 지하 공동 실시간 현황</footer></main>
<script>
const base='https://mwgetcwuumvapuoeloiu.supabase.co';
const apiKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13Z2V0Y3d1dW12YXB1b2Vsb2l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5OTE0NDMsImV4cCI6MjEwODU2NzQ0M30.QX-wTqpPd_R8IvoWT4hDGRa4HvlWCXL67zSg9QGnNz4';
const headers={'apikey':apiKey,'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'};
const state={waiting:0,a:false,b:false,c:false,d:false};let ready=false,busy=false,refreshing=false,lastUpdate='';
const el=id=>document.getElementById(id);
function status(msg,good=false){el('connection').textContent=msg;el('connection').className='net'+(good?' live':'')}
function message(msg,error=false){el('message').textContent=msg;el('message').className='info'+(error?' error':'')}
function draw(){el('waiting').textContent=state.waiting;for(const room of [{id:'demian',slots:['a','b']},{id:'sea',slots:['c','d']}]){const container=el(room.id+'Slots');container.replaceChildren();let count=0;room.slots.forEach(key=>{const occupied=Boolean(state[key]);if(occupied)count++;const card=document.createElement('div');card.className='slot'+(occupied?' occupied':'');const t=document.createElement('div');t.className='team';t.textContent=key.toUpperCase()+'팀';const s=document.createElement('div');s.className='slotstate';s.textContent=occupied?'● 체험 중':'빈자리';card.append(t,s);if(occupied){const button=document.createElement('button');button.className='finish';button.textContent='체험 종료';button.disabled=!ready||busy;button.addEventListener('click',()=>action('finish',key));card.append(button)}container.append(card)});el(room.id+'Count').textContent=count+' / 2팀 체험 중';el(room.id+'Receive').disabled=!ready||busy||state.waiting<1||count===2}el('plus').disabled=!ready||busy;el('minus').disabled=!ready||busy||state.waiting<1}
async function request(path,body){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),8500);try{const response=await fetch(base+'/rest/v1/'+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});const raw=await response.text();let result;try{result=raw?JSON.parse(raw):null}catch{result=null}if(!response.ok)throw new Error(result?.message||'HTTP '+response.status);return result}finally{clearTimeout(timeout)}}
async function fetchState(){if(refreshing||busy)return;refreshing=true;try{const result=await request('event_state?id=eq.1&select=*');if(!Array.isArray(result)||!result.length)throw new Error('상태 데이터를 찾을 수 없음');if(result[0].updated_at!==lastUpdate||!ready){Object.assign(state,result[0]);lastUpdate=result[0].updated_at;draw()}ready=true;status('● 연결됨',true);draw()}catch(err){status('연결 오류');ready=false;draw();message('연결 오류: '+(err.name==='AbortError'?'응답 시간 초과':err.message),true)}finally{refreshing=false}}
async function action(type,slot=''){if(!ready||busy)return;busy=true;draw();try{const result=await request('rpc/event_action',{p_action:type,p_slot:slot});Object.assign(state,result);lastUpdate=result.updated_at;message(type==='finish'?slot.toUpperCase()+'팀 체험 종료':type==='receive'?'1팀 입장 처리 완료':'대기팀 수 변경 완료');status('● 연결됨',true)}catch(err){message('변경 실패: '+err.message,true)}finally{busy=false;draw();setTimeout(fetchState,150)}}
el('plus').onclick=()=>action('plus');el('minus').onclick=()=>action('minus');el('demianReceive').onclick=()=>action('receive','demian');el('seaReceive').onclick=()=>action('receive','sea');draw();fetchState();setInterval(fetchState,2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchState()});
</script></body></html>
